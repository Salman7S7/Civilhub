name: Build & Release Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: CivilHub/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./CivilHub
        run: npm ci || npm install

      - name: 🛠️ Generate Android Native Project (Expo Prebuild)
        working-directory: ./CivilHub
        run: npx expo prebuild --platform android --clean

      - name: 🏗️ Build Android Release APK
        working-directory: ./CivilHub/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivilHub-Build-${{ github.run_number }}
          path: CivilHub/android/app/build/outputs/apk/release/*.apk

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "CivilHub Android APK (Build #${{ github.run_number }})"
          body: |
            ### 📱 Automated Build #${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            - **Author**: `${{ github.actor }}`
            - **Branch**: `master`

            👇 Download the `.apk` file below to install directly on your Android phone.
          draft: false
          prerelease: false
          files: |
            CivilHub/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
